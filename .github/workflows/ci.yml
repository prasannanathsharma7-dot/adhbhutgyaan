# Continuous integration: runs on every push / pull request to main.
# (Replaces the Deno starter template, which could never pass on this Node/React project.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests (system health + security + pricing)
        run: npm test
      - name: Production build (client + SSR + prerender + sitemap)
        run: npm run build
