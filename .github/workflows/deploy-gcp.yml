name: Deploy to Google Cloud Run (Workload Identity Federation)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: 'project-2764f1c7-0aeb-45b8-a69'
  REGION: 'asia-south1' # Mumbai region (or change to us-central1 / your preferred region)
  SERVICE_NAME: 'adhbhutgyaan'
  GAR_REPOSITORY: 'adhbhutgyaan-repo'
  IMAGE_NAME: 'adhbhutgyaan-app'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/549515071322/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'adhbhutgyaan-deploy@project-2764f1c7-0aeb-45b8-a69.iam.gserviceaccount.com'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    # Crucial for Workload Identity Federation (OIDC token generation)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Authenticate with Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: 'access_token'

      # Step 2: Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Step 3: Configure Docker for Google Artifact Registry
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Step 4: Build and Push Docker image
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Step 5: Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: '--allow-unauthenticated --port=8080'

      # Step 6: Show Deployed URL
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🚀 Cloud Run Deployment Successful!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "=========================================="
